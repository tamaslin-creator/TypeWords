<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    const base = '/TypeWords/';
    const path = window.location.pathname.replace('/TypeWords/', '');
    const query = window.location.search;
    const hash = window.location.hash;

    sessionStorage.setItem(
      'typewords_redirect',
      '/' + path + query + hash
    );

    window.location.replace(base);
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
